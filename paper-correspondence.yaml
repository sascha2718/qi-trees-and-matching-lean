    headline: true
    note: "The three audited declarations separate the finite-class input from the full classification. The classification endpoint places no restriction on the two laws and holds almost surely under the product of the unconditioned laws. It expresses the conditioning on infinite diameter by quantifying over the surviving samples, and its first alternative is the finite class. The library internally replaces a nonminimal support bound J by the actual largest supported arity."

