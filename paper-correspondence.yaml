  - source: "thm:embedding-hierarchy"
    kind: theorem
    status: formalized
    lean: ["Challenge.audit_mutual_embeddability"]
    relation: exact
    headline: true
    note: "The conditioning on infinite diameter is expressed by quantifying over the surviving samples of the unconditioned law, as in the classification endpoint. The proof chooses a representative of a chain class from the atoms of its semigroup and treats the bushy class through the survival skeleton. Lean first trims the support bound to J = max supp theta, then uses one representative for all three supercritical classes, the mixture theta' = (7/8) delta_{J_1} + (1/8) theta with J_1 - 1 = 24(J - 1) a multiple of a generator of Lambda_theta (BranchingProcess.Offspring.concentrate), which lies in the class of theta by BranchingProcess.Offspring.sameInfiniteClass_concentrate. The retained vertex of the representative is found under the conditioned law as in the note on thm:concentrated-regular-subtree, so the bushy case does not pass through the skeleton, and the classification transports the binary subtree in every case. The passage from the product law to the law of the tree uses that the representative survives with positive probability. No measurability of the embedding event is asserted. The strict hierarchy Fin < N_0 < T of sec:embedding-hierarchy carries no numbered statement in the paper. Lean records it in ChainClasses.qiEmbeddable_rayGraph_of_not_survives, ChainClasses.not_qiEmbeddable_rayGraph_of_not_survives, ChainClasses.qiEmbeddable_rayGraph_of_survives and ChainClasses.ae_not_qiEmbeddable_rayGraph, the last through BranchingProcess.not_qiEmbeddable_rayGraph, the form of thm:three-rays for quasi-isometric embeddings from which the quasi-isometry statement is derived. The composition of the two embeddings for two independent laws is ChainClasses.mutual_embeddability_ae."

  - source: "thm:concentrated-regular-subtree"
    kind: lemma
    status: formalized
    lean: ["BranchingProcess.retainedInf_iff", "BranchingProcess.retainedProb_succ", "BranchingProcess.ofReal_le_retainedProb", "BranchingProcess.ofReal_le_sampleMeasure_retainedInf", "BranchingProcess.retainedTreeLaw_eq_treeLaw", "BranchingProcess.exists_regular_embedding_of_retainedInf", "BranchingProcess.exists_binary_embedding_of_retainedInf", "ChainClasses.sampleMeasure_spine_fail", "ChainClasses.sampleMeasure_spine_fail_le", "ChainClasses.ae_exists_spine_retained", "ChainClasses.ae_exists_retained_vertex", "ChainClasses.ae_qiEmbeddable_binary_of_concentrated"]
    relation: split
    headline: false
    note: "The proof bounds the binomial lower tail by Chebyshev's inequality and runs the induction at the level 3/4. Lean bounds P(Bin(J,p) < m) by the union bound over the at most 2^J patterns of fewer than m surviving children, which gives 2^J (1-p)^(J - floor(J/2)) <= 7/100 for p >= 4/5 and J >= 24, and runs the induction at the level 4/5 (BranchingProcess.ofReal_le_retainedProb). The stated bound 3/4 follows. The exact identity eq:pruned-subtree-recursion is BranchingProcess.retainedProb_succ, and its fixed point for the retained root, p = theta_J P(Bin(J,p) >= m), is BranchingProcess.sampleMeasure_retainedInf_eq. Only the induction replaces the identity by the union bound. The retained vertex of the sample is found in two ways. Along the first-child ray, as in the paper, the events A_n have common probability theta_J p and ChainClasses.sampleMeasure_spine_fail gives P(tau >= N) = (1 - theta_J p)^N, bounded by (11/32)^N in ChainClasses.sampleMeasure_spine_fail_le, with the retained vertex 1^n 2 of the sample in ChainClasses.ae_exists_spine_retained. Along the descent through first surviving children of the skeleton under the conditioned law, ChainClasses.ae_exists_retained_vertex uses the branching property of the surviving subtrees instead. This form does not require theta_0 = 0 and is the one the proof of thm:embedding-hierarchy uses. The Galton-Watson assertion is stated, as the Harris decomposition is in thm:harris, for the retained descendant tree of the root re-addressed by rank, BranchingProcess.retTree. Under the law conditioned on the root being retained, BranchingProcess.retainedTreeLaw_eq_treeLaw identifies its law with that of a Galton-Watson tree whose offspring law BranchingProcess.Offspring.pruned is the binomial law with parameters J and p conditioned to be at least m, supported on {m,...,J}. The regular m-ary subtree rooted at a retained vertex of the sample, every vertex of which has J children in the tree, is BranchingProcess.exists_regular_embedding_of_retainedInf."

