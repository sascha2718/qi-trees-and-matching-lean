name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages runs one deployment at a time, and a queued one is worth finishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docs:
    name: Build the api documentation
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Check out the project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: project

      # The key is the one `Build and audit` writes; this job only reads it.
      - name: Restore the library build output
        uses: actions/cache/restore@v4
        with:
          path: project/.lake/build
          key: lake-build-${{ hashFiles('project/lean-toolchain', 'project/lakefile.toml', 'project/lake-manifest.json') }}-${{ hashFiles('project/**/*.lean') }}
          restore-keys: |
            lake-build-${{ hashFiles('project/lean-toolchain', 'project/lakefile.toml', 'project/lake-manifest.json') }}-

      - name: Build
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          lake-package-directory: project
          build: true
          lint: false
          mk_all-check: false

      # The documentation of the dependencies is the expensive part of the doc
      # build and it changes only with the manifest, so it alone is cached.
      - name: Cache the documentation of the dependencies
        uses: actions/cache@v4
        with:
          path: |
            project/docbuild/.lake/build/doc/Mathlib
            project/docbuild/.lake/build/doc/Archive
            project/docbuild/.lake/build/doc/Counterexamples
            project/docbuild/.lake/build/doc/Aesop
            project/docbuild/.lake/build/doc/Batteries
            project/docbuild/.lake/build/doc/Cli
            project/docbuild/.lake/build/doc/ImportGraph
            project/docbuild/.lake/build/doc/LeanSearchClient
            project/docbuild/.lake/build/doc/Plausible
            project/docbuild/.lake/build/doc/ProofWidgets
            project/docbuild/.lake/build/doc/Qq
            project/docbuild/.lake/build/doc/Init
            project/docbuild/.lake/build/doc/Lake
            project/docbuild/.lake/build/doc/Lean
            project/docbuild/.lake/build/doc/Std
          key: docs-${{ hashFiles('project/lake-manifest.json') }}

      # doc-gen4 is required by a throwaway package created here on the runner,
      # which reaches the libraries through a path dependency and shares their
      # packages directory. The project's own lakefile and manifest are left
      # untouched, so nothing about this build has to be carried in the tree.
      # doc-gen4 tags a release per toolchain, hence the tag read from
      # lean-toolchain, and the four libraries are those of defaultTargets.
      - name: Build the documentation
        working-directory: project
        run: |
          mkdir -p docbuild
          cat > docbuild/lakefile.toml <<TOML
          name = "docbuild"
          reservoir = false
          version = "0.1.0"
          packagesDir = "../.lake/packages"

          [[require]]
          name = "graphmatching"
          path = "../"

          [[require]]
          scope = "leanprover"
          name = "doc-gen4"
          rev = "$(cut -d: -f2 lean-toolchain)"
          TOML
          cd docbuild
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update graphmatching
          lake build GraphMatching:docs GraphMarkovMatching:docs ChainClasses:docs BranchingProcess:docs

      # The generated documentation is the whole site.
      - name: Assemble the site
        run: |
          mkdir site
          cp -r project/docbuild/.lake/build/doc/. site/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
