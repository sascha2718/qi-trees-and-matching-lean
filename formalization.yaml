# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Provenance metadata for the Lean formalisation accompanying
# "The quasi-isometry classes of Galton–Watson trees" (Athreya and Troscheit, arXiv:2609.23882).
# Follows the mathlib-initiative formalization.yaml v0.4 self-reporting format.

version: "v0.4"

project:
  name: "The quasi-isometry classes of Galton–Watson trees: Lean formalisation"
  description: >-
    Lean 4 formalisation of the automorphism-matching theorems and the quasi-isometry
    classification of Galton–Watson trees from the paper "The quasi-isometry classes of
    Galton–Watson trees" by Jayadev S. Athreya and Sascha Troscheit (arXiv:2609.23882). The
    audited statements are: the i.i.d. matching theorem on the binary tree (leaf and full
    bounds, and the existence of a root-fixing automorphism of the infinite binary tree matching
    two independent i.i.d. labellings with probability at least 1 - 16 η_{5/2}, where η_{5/2}
    is the one-site potential of the label law); the general Markov matching theorem for
    typed label processes on the binary tree, in its finite-type and zero-compatible forms at
    finite and at infinite height, with a failure probability at most a constant multiple of
    the one-site defect; the complete classification, up to quasi-isometry, of Galton–Watson
    trees with finitely supported offspring law conditioned on infinite diameter, into the ray
    class, the binary-tree class, one chain class for each branching semigroup, and the bushy
    class, with two independent conditioned trees almost surely quasi-isometric exactly when
    their laws share a class, together with the finite class, so that over the unconditioned
    laws two trees are almost surely quasi-isometric exactly when both are finite or both are
    infinite with laws in the same class; the mutual embeddability theorem, that a
    Galton–Watson tree with finitely supported supercritical offspring law, conditioned on
    infinite diameter, almost surely admits quasi-isometric embeddings into the binary tree and
    from it; and, for offspring supported on {1,2}, almost sure quasi-isometry
    together with an explicit exponential bound on the failure probability of a
    (D^2+3)-quasi-isometry. The statements are made in Challenge.lean over Mathlib alone and
    discharged by Solution.lean from four library targets.
  authors:
    - "Jayadev S. Athreya"
    - "Sascha Troscheit"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Sascha Troscheit"

classification:
  arxiv: ["math.PR", "math.MG"]
  msc2020: ["60J80", "05C80", "51F30", "05C05"]

sources:
  - title: "The quasi-isometry classes of Galton–Watson trees"
    authors:
      - "Jayadev S. Athreya"
      - "Sascha Troscheit"
    type: "paper"
    id: "arXiv:2609.23882"
    location: "Theorems 1.2, 1.3, 1.4, 5.1 and 6.1; Appendix B"
    relationship: "formalizes"
    note: >-
      The paper whose matching theorems and classification are formalised here, available at
      https://arxiv.org/abs/2609.23882. Theorem numbers in this file refer to its version 1.
      Its Appendix B records the statement-by-statement correspondence with the Lean
      declarations, and paper-correspondence.yaml in this repository records the same
      correspondence for the static check described in the README. The formalisation and the
      paper were developed together by the same authors. No novelty is claimed here beyond
      what the paper itself claims.
    license: "CC-BY-NC-SA-4.0"
    author_endorsement: "participated"
  - title: "Branching Processes"
    authors:
      - "Krishna B. Athreya"
      - "Peter E. Ney"
    type: "book"
    location: "Springer, Die Grundlehren der mathematischen Wissenschaften 196, 1972"
    relationship: "background"
    note: "Standard reference for the Galton–Watson foundations used by the BranchingProcess library."

# No earlier formalisation of these results, in Lean or another system, is known to the authors.
related_formalizations: []

status:
  scope: >-
    Formalised and audited: the thirteen theorems listed in comparator.json, namely the i.i.d.
    matching theorem (Theorem 5.1 of the manuscript: leaf bound, full bound and the infinite
    tree), the Markov matching theorem (Theorem 6.1, in four forms: finite-type and
    zero-compatible alternatives, each at finite height and at infinite height), the complete
    classification (Theorem 1.2) in three statements (bounded connected graphs are
    quasi-isometric to a point, laws with mean at most one and theta_1 different from 1 die
    out almost surely, and the classification itself over the unconditioned product law, in
    which two trees are almost surely quasi-isometric exactly when both are finite or both are
    infinite with laws in the same infinite class), the mutual embeddability theorem
    (Theorem 1.3: a survival-conditioned supercritical tree almost surely admits
    quasi-isometric embeddings into the binary tree and from it), and the two-value
    universality theorem with its quantitative rate (Theorem 1.4). Beyond these endpoints the
    four libraries machine-check the numbered statements of the matching parts, the
    Galton–Watson foundations, the geometric obstructions, the pruning lemma behind the
    embedding theorem (the exact binomial recursion, the conditional Galton–Watson law of the
    retained descendant tree, the regular m-ary subtree and the first-child-ray bound) and the
    strict embedding hierarchy, as recorded in the paper's appendix.
    Not formalised: the quasisymmetry corollary for the boundaries
    (Corollary 1.5) and the fractal percolation application (Corollary 3.1); and the two families
    of binary trees with continuous random branching times (Section 7). The analytic constants
    of the i.i.d. theorem are machine-checked through rational upper bounds for the closed-form
    maxima.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

