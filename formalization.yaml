fidelity:
  divergences: >-
    The Lean statements are the manuscript's statements with these presentational differences.
    Vertices of the infinite binary tree are addressed by List Bool where the prose uses words
    over {1,2}, and Galton–Watson vertices by words over Fin N. Finite-height labellings and
    the automorphism group are defined by recursion on the height rather than through an
    alphabet; one unrestricted matching relation serves both the i.i.d. and Markov results.
    The library proves the recursive matching relation equal to matching over root-fixing
    graph automorphisms. Markov laws are stated directly on state labellings, with types
    indexing the laws; the solution proves that these are the projections of the typed
    implementation. The finite-type transition bound sums over the full positive support,
    as in the manuscript's headline theorem. The classification is stated for laws packaged
    with an upper support bound J at most the arity N. No positive mass at J is required:
    the library tightens the support bound internally. The two-value and general
    classification statements use the same parent-child graph and quasi-isometry definitions. The
    i.i.d. constants are checked through rational upper bounds for the closed-form maxima
    L_{5/2}, K_{5/2} and C_{5/2}. Challenge.lean contains one sorry per audited theorem, which
    Solution.lean supplies; comparator.json declares no definition_names, so no part of
    the statement vocabulary is left open for the solution to instantiate.

review:
  status: "self-assessed"
  reviewers:
    - "Sascha Troscheit"
    - "Jayadev S. Athreya"
  notes: >-
    No independent human review of the Lean development. The authors audited the statement
    surface in Challenge.lean against the manuscript, and the comparator independently checks
    that Solution.lean proves those statements from propext, Classical.choice and Quot.sound
    alone. Neither check assesses whether the informal statements are the right formalisation
    of the manuscript's theorems; that correspondence is documented in the paper's appendix.

alignment:
  namespace: "Challenge"
  statements:
    - source: "Theorem 5.1 (Matching theorem), the leaf bound"
      lean: "Challenge.audit_graph_leaf_matching_bound"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from GraphMatching.Graph."
    - source: "Theorem 5.1 (Matching theorem), the full bound"
      lean: "Challenge.audit_graph_full_matching_bound"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from GraphMatching.Graph."
    - source: "Theorem 5.1 (Matching theorem), the infinite tree"
      lean: "Challenge.audit_exists_infinite_tree_matching_graphAut"
      module: "Challenge"
      status: "proved"
      note: >-
        Asserts a root-fixing graph automorphism of the infinite binary tree matching the two
        consistent i.i.d. labellings at every vertex. Proved in Solution from
        GraphMatching.Kolmogorov and GraphMatching.AutBridge.
    - source: "Theorem 1.2, finite class: bounded connected graphs are quasi-isometric to a point"
      lean: "Challenge.audit_bounded_graph_qi_point"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from BranchingProcess.Geometry."
    - source: "Theorem 1.2, finite class: laws with mean at most one die out almost surely"
      lean: "Challenge.audit_extinction_of_not_supercritical"
      module: "Challenge"
      status: "proved"
      note: "Excludes the deterministic single child theta_1 = 1. Proved in Solution from BranchingProcess.Law."
    - source: "Theorem 1.2 (Complete quasi-isometry classification), including the finite class"
      lean: "Challenge.audit_full_classification_ae_iff"
      module: "Challenge"
      status: "proved"
      note: >-
        Over the unconditioned product law, two independent trees almost surely admit a
        root-preserving quasi-isometry exactly when both are finite, or both are infinite and
        the laws lie in the same infinite class, and admit no quasi-isometry otherwise. Proved
        in Solution from ChainClasses.Classification.Finite.
    - source: "Theorem 1.3 (Mutual embeddability)"
      lean: "Challenge.audit_mutual_embeddability"
      module: "Challenge"
      status: "proved"
      note: >-
        On survival, the sample almost surely embeds quasi-isometrically into the binary tree
        and receives a quasi-isometric embedding of it. Proved in Solution from
        ChainClasses.Classification.Embedding, through the pruning lemma of
        BranchingProcess.Pruning and the classification.
    - source: "Theorem 1.4 (Universality in the two-value family), almost sure statement"
      lean: "Challenge.audit_twovalue_ae_tree_family"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from ChainClasses.TwoValue."
    - source: "Theorem 1.4 (Universality in the two-value family), the rate (1.1)"
      lean: "Challenge.audit_twovalue_rate_tree"
      module: "Challenge"
      status: "proved"
      note: >-
        The failure probability of a (D^2+3)-quasi-isometry above a threshold D_0 is at most
        256 sqrt(theta_1^{D(2D-5)}), the square-root form of the paper's rate. Proved in
        Solution from ChainClasses.TwoValue.
    - source: "Theorem 6.1 (Markov matching), finite alternative"
      lean: "Challenge.audit_markov_matching_finite"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from GraphMarkovMatching.Stopped.Main."
    - source: "Theorem 6.1 (Markov matching), zero-compatible alternative"
      lean: "Challenge.audit_markov_matching_zero"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from GraphMarkovMatching.Stopped.Main."
    - source: "Theorem 6.1 (Markov matching), finite alternative at infinite height"
      lean: "Challenge.audit_markov_matching_finite_infinite"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from GraphMarkovMatching.Stopped.Main."
    - source: "Theorem 6.1 (Markov matching), zero-compatible alternative at infinite height"
      lean: "Challenge.audit_markov_matching_zero_infinite"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from GraphMarkovMatching.Stopped.Main."

