        per file, used to write, refactor and repair library proofs against a fixed statement
        surface. Every retained argument was selected, checked and curated by the authors.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "n/a"
    - method: "other"
      models: []
      framework: "vibefeld (Tobias Osborne)"
      tool_setup: >-
        AI-assisted formalisation workflow that produced a readable intermediate formalisation,
        later superseded by the present development.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
    - method: "copilot"
      models: ["ChatGPT (OpenAI)"]
      framework: "n/a"
      tool_setup: >-
        Interactive assistance with individual Lean arguments, optimisation of parts of the
