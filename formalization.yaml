      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "API-only"
      prompting_notes: "n/a"
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: >-
        Statement design, the Challenge and Solution modules, the comparator configuration,
